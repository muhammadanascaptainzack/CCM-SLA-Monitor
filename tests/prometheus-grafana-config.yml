# Prometheus & Grafana Monitoring Configuration for Citrus ISP Complaint Portal
# Save Prometheus config to: /etc/prometheus/prometheus.yml

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'citrus-cms-portal'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['127.0.0.1:4000']
        labels:
          service: 'citrus-isp-cms'
          district: 'Sargodha'

  - job_name: 'ubuntu-node-exporter'
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['127.0.0.1:9113']
